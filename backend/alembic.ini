[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

# The connection URL is never stored here. env.py reads MAYA_MIGRATION_DATABASE_URL
# (or an explicit env file passed with: alembic -x env_file=<path> upgrade head).
