[project]
name = "maya-backend"
version = "0.1.0"
description = "MAYA AI local API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.0.57",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs==0.32.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
# Isolated worker/SDK projects have their own locked dependencies and strict checks.
# Host orchestration, metrics, offline CLIs and deterministic tests remain checked here.
# arq_worker.py imports ARQ-only SDKs and is checked through the S1 spike environment.
exclude = ['^tests/spikes/s1/(driver|runtime|arq_worker)\.py$', '^tests/spikes/gemini/']
