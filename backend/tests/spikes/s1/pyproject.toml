[project]
name = "maya-s1-queue-spike"
version = "0.1.0"
description = "Isolated synthetic Celery versus ARQ benchmark for Phase 01 S1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq==0.28.0",
    "asyncpg==0.32.0",
    "celery[redis]==5.6.3",
    "langgraph==1.2.20",
    "redis==5.3.1",
]

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
