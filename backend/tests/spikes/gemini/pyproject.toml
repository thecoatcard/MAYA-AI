[project]
name = "maya-gemini-sdk-spikes"
version = "0.1.0"
description = "Isolated, mocked Phase 01 S3/S4 Google Gen AI SDK adapters"
requires-python = ">=3.12,<3.13"
dependencies = ["google-genai==2.34.0"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["checks"]
python_files = ["sdk_*_checks.py"]
pythonpath = [".", "../../.."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["gemini_spike", "checks"]
mypy_path = [".", "../../.."]
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
