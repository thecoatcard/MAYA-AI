# Maya AI Anti-SSRF & DNS-Rebinding Egress Proxy Configuration (Squid/Envoy)
# Phase 13, Decisions D4, D14

# Port binding
http_port 3128

# Prohibited destination ACLs (RFC 1918, Loopback, Cloud Metadata)
acl blocked_subnets dst 10.0.0.0/8
acl blocked_subnets dst 172.16.0.0/12
acl blocked_subnets dst 192.168.0.0/16
acl blocked_subnets dst 127.0.0.0/8
acl blocked_subnets dst 169.254.0.0/16
acl blocked_subnets dst 0.0.0.0/8
acl blocked_subnets dst 100.64.0.0/10
acl blocked_subnets dst fc00::/7
acl blocked_subnets dst fe80::/10
acl blocked_subnets dst ::1/128

# Block access to AWS/GCP/Azure link-local metadata explicitly
acl metadata_endpoints dstdomain 169.254.169.254
acl metadata_endpoints dstdomain metadata.google.internal
acl metadata_endpoints dstdomain instance-data

# Permitted ports (HTTP/HTTPS only)
acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# Access Rules
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny metadata_endpoints
http_access deny blocked_subnets
http_access allow all

# Anti-DNS Rebinding: Force fresh DNS resolution on egress connections
dns_v4_first on
positive_dns_ttl 30 seconds
negative_dns_ttl 10 seconds

# Logging
access_log /var/log/squid/access.log squid
