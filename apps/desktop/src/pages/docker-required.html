<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAYA</title>
<style>
:root {
  --bg:#f1f2f5; --surface:#ffffff; --border:#d3d6dd; --text:#101216; --muted:#525967;
  --accent:#3046d4; --accent-hover:#2a3fc4; --accent-text:#ffffff; --hover:#dcdfe6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0b0d11; --surface:#12151b; --border:#272c36; --text:#e8eaee; --muted:#98a0ae;
    --accent:#8da0ff; --accent-hover:#9dafff; --accent-text:#0a1030; --hover:#262b36;
  }
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font:15px/1.55 "IBM Plex Sans", system-ui, "Segoe UI Variable Text", "Segoe UI", sans-serif; display:flex; flex-direction:column; }
.drag { height:36px; flex:none; -webkit-app-region:drag; }
main { flex:1; display:grid; place-items:center; padding:24px; }
.card {
  width:min(480px,100%); background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 28px 24px;
  box-shadow:0 0 0 1px var(--border), 0 4px 20px rgba(0,0,0,.18);
  animation:rise 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@supports (corner-shape: squircle) { .card, .btn { corner-shape: squircle; } }
h1 { font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
p { margin:0 0 14px; color:var(--muted); }
.btn {
  display:inline-block; padding:8px 16px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-text);
  text-decoration:none; font-weight:500; margin-right:8px;
  transition:transform 160ms cubic-bezier(0.32, 0.72, 0, 1), background-color 160ms ease, border-color 160ms ease;
}
.btn:hover { background:var(--accent-hover); transform:translateY(-1px); }
.btn:active { transform:scale(0.98); }
.btn.quiet { background:transparent; color:var(--text); border-color:var(--border); }
.btn.quiet:hover { background:var(--hover); transform:translateY(-1px); }
.btn.quiet:active { transform:scale(0.98); }
code { font:13px "IBM Plex Mono", ui-monospace, Consolas, monospace; color:var(--muted); word-break:break-all; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="drag"></div>
<main><div class="card" role="alert">
  <h1>Docker Desktop is required</h1>
  <p>MAYA keeps its database and cache in two Docker containers. Start Docker Desktop, wait until it says it is running, then try again.</p>
  <p><a class="btn" href="maya-action:retry">Retry</a><a class="btn quiet" href="maya-action:open-logs">Open logs</a></p>
</div></main>
</body>
</html>
